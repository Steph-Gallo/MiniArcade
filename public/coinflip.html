    <h1>Coin Flip Game</h1>
    <div class="container my-5">
  <div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">

      <div class="card shadow-sm">
        <div class="card-body text-center p-4">

          <h1 class="h3 mb-2">Coin Flip Game</h1>
          <p class="text-muted mb-4">Heads or tails, then click flip.</p>

            <!-- Game buttons -->
          <div class="d-flex justify-content-center flex-wrap gap-2 mb-3">
            <button class="btn btn-primary" onclick="play('heads')">Heads</button>
            <button class="btn btn-primary" onclick="play('tails')">Tails</button>
            <button class="btn btn-outline-danger" onclick="resetGame()">Reset</button>
        </div>


          <div id="result" class="alert alert-info mb-3"></div>

          <h2 class="h6 text-uppercase text-muted mb-2">Score</h2>
          <p class="fs-5 mb-0">
            You: <span id="you" class="fw-bold text-primary">0</span>
            <span class="mx-2">|</span>
            Computer: <span id="cpu" class="fw-bold text-danger">0</span>
          </p>

        </div>
      </div>

    </div>
  </div>
</div>


    <script>

    let you = 0;
    let cpu = 0;

    // Main game function
    function play(choice) {

        //flip logic: 50% chance for heads or tails
        const flip = Math.random() < 0.5 ? "heads" : "tails";

        // Check if user choice matches the flip result
        if (flip === choice) {
            you++;
            document.getElementById("result").innerHTML =
                "It was " + flip + ". Congrats, you WIN! <br> Click again to play.";
        } else {
            cpu++;
            document.getElementById("result").innerHTML =
                "It was " + flip + ". You LOSE. <br> Click again to play.";
        }

        document.getElementById("you").textContent = you;
        document.getElementById("cpu").textContent = cpu;
    }

    // Reset game function
    function resetGame() {
        you = 0;
        cpu = 0;

        document.getElementById("you").textContent = 0;
        document.getElementById("cpu").textContent = 0;
        document.getElementById("result").textContent =
            "New Game. Click Heads or Tails.";
    }

</script>
